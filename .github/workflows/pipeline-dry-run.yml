# Pipeline dry run — GitHub-hosted runner, SYNTHETIC data, no external storage.
#
# Phase 1 of the off-PC scheduled-capture work: prove the real pipeline
# (`python run.py --refresh`) runs end-to-end on a GitHub-hosted runner with a
# synthetic portfolio, that a second refresh does not rewrite settled history,
# and that the lockfile PID-liveness fix heals a stale lock. It publishes
# nothing and stores nothing off-repo.
#
# Triggers:
#   * `workflow_dispatch` — manual, the primary trigger now.
#   * `push` to `ci/**` — a testing affordance so a work branch can exercise
#     this workflow without a manual dispatch. It must NEVER fire for `main`.
#
# Recurring `schedule:` triggers and any storage publishing activate ONLY after
# the storage design is approved (phase 2). This file must never carry a
# `schedule:` key while phase 1 is the only approved phase.
name: Pipeline dry run

on:
  workflow_dispatch:
  push:
    branches: ["ci/**"]

permissions:
  contents: read

concurrency:
  group: pipeline-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Seed synthetic portfolio
        run: python scripts/ci_dry_run.py seed --data-dir data

      - name: Run pipeline (refresh)
        timeout-minutes: 15
        run: python run.py --refresh --logfile-prefix data/logs/refresh

      - name: Validate run 1
        run: >-
          python scripts/ci_dry_run.py validate
          --data-dir data
          --report data/logs/dry-run-report.txt

      - name: Idempotency check (second refresh)
        run: |
          cp data/portfolio_history.json data/portfolio_history.before.json
          python run.py --refresh --logfile-prefix data/logs/refresh
          python scripts/ci_dry_run.py check-idempotency \
            --before data/portfolio_history.before.json \
            --after data/portfolio_history.json \
            --report data/logs/dry-run-report.txt

      - name: Lock-heal check
        run: |
          printf 'pid=999999 started=2026-01-01 00:00:00\n' > data/refresh.lock
          rc=0
          python run.py --news-refresh --logfile-prefix data/logs/news || rc=$?
          {
            echo ""
            echo "== lock-heal check =="
            echo "  news-refresh exit code: $rc"
          } >> data/logs/dry-run-report.txt
          if [ "$rc" -ne 0 ]; then
            echo "RESULT: FAIL (news-refresh exited $rc)" | tee -a data/logs/dry-run-report.txt
            exit 1
          fi
          if [ -f data/refresh.lock ]; then
            echo "RESULT: FAIL (data/refresh.lock still present)" | tee -a data/logs/dry-run-report.txt
            exit 1
          fi
          echo "RESULT: OK (exit 0 and lock removed)" | tee -a data/logs/dry-run-report.txt

      # Schedule-monitoring hooks. No-op when HEALTHCHECK_URL is unset, and
      # `|| true` guarantees a heartbeat can never change the job outcome.
      - name: Heartbeat (success)
        if: success()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -m 10 --retry 3 -o /dev/null -sS "$HC_URL" || true
          fi

      - name: Heartbeat (failure)
        if: failure()
        env:
          HC_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: |
          if [ -n "$HC_URL" ]; then
            curl -m 10 --retry 3 -o /dev/null -sS "$HC_URL/fail" || true
          fi

      - name: Upload dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-evidence
          path: |
            data/logs/
            data/dashboard.json
            data/portfolio_history.json
          if-no-files-found: warn

      - name: Append validation report to summary
        if: always()
        run: |
          if [ -f data/logs/dry-run-report.txt ]; then
            {
              echo "## Pipeline dry run — validation report"
              echo '```'
              cat data/logs/dry-run-report.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No validation report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
