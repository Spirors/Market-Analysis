name: spike-gha-probe

on:
  push:
    branches: [spike/gha-probe]
    paths-ignore:
      - 'spike/evidence/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: spike-gha-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - run: python spike/gha_probe.py

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gha-probe-evidence
          path: spike/evidence/
          if-no-files-found: warn

      - name: Commit and push evidence
        if: always()
        run: |
          git config user.name "gha-spike"
          git config user.email "gha-spike@users.noreply.github.com"
          git add spike/evidence
          git diff --cached --quiet || git commit -m "chore(spike): gha probe evidence [skip ci]"
          git push origin HEAD:spike/gha-probe
